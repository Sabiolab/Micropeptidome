# Paths
units_csv: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/Liver/units_liver.csv"
sample_metadata_csv: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/Liver/SampleMetadata.csv"
cohort_prefix: "Liver"
genome_fa: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/GRCh38.primary_assembly.genome.fa"
genome_gtf: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/gencode.v38.primary_assembly.annotation.gtf"

# BLASTP (human proteome homology)
human_proteome_fa: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/human_proteome.faa"
human_blastdb_prefix: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/human_proteome"  # where DB files will be created and with what prefix

# Helper scripts
filter_smorf_pep_py: "scripts/filter_smorf_pep.py"
tx_to_genome_py: "scripts/smorfs_transcript_to_genome_gtf.py"
merge_script: "scripts/merge_shortstop_output.py"
aggregate_script: "scripts/aggregate_smorfs_by_locus.py"
make_smorf_rsem_ref_script: "scripts/make_smorf_rsem_ref_from_locus_summary.py"
add_rsem_tpms_script: "scripts/add_rsem_tpms_to_locus_summary.py"
export_rsem_counts_script: "scripts/export_rsem_counts_matrix.py"
blastp_append_script: "scripts/blastp_append_human_homology.py"

# Output directories
outdir: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/Liver"
condition_results_dir: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/Liver/results_conditions"
condition_merged_dir: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/Liver/merged_per_condition"
rsem_dir: "/storage/scratch01/groups/md/microproteins/Microproteins_pipeline/Liver/results_rsem_smorf"

# Sample / condition metadata
patient_id_column: "PatientID"
condition_column: "Condition"

# Alignment / assembly stack.
# strandedness is shared across StringTie and RSEM.
# "forward" corresponds to StringTie --fr.
# "reverse" corresponds to StringTie --rf.
strandedness: "reverse" # "none", "forward", or "reverse"

# Trim Galore
threads_trim_galore: 4
mem_trim_galore_mb: 8000
runtime_trim_galore_min: 180

# STAR
threads_star_index: 8
mem_star_index_mb: 64000
runtime_star_index_min: 360
threads_star_align: 8
mem_star_align_mb: 64000
runtime_star_align_min: 720
star_sjdb_overhang: 149

# StringTie
threads_stringtie: 2
stringtie_rRNA: true # set true to pass -N to StringTie3 for Total RNA / rRNA-depleted libraries

# RSEM
threads_rsem_align: 6
threads_rsem_em: 6

# ShortStop
min_prob: None

# Threads
threads_shortstop: 2

# Runtime in minutes
runtime_gffread_min: 60
runtime_transdecoder_longorfs_min: 720
runtime_transdecoder_predict_min: 720
runtime_shortstop_predict_min: 360

# min_aa affects TD2.LongOrfs and the downstream peptide-length filtering step.
# smaller values increase runtime and may increase false positives.
# TD2 defaults to 90 aa if -m is not provided.
min_aa: 30
max_aa: 150
pred_csv: "sams.csv" # this is ALL SAMs, but we can also use "sam_secreted.csv" or "sam_intracellular.csv" 
