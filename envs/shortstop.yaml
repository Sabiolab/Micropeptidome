name: shortstop
channels:
  - conda-forge
  - bioconda
dependencies:
  # TensorFlow 2.11 is substantially easier to solve on an older Python stack
  # than alongside the newer StringTie/htslib toolchain used elsewhere.
  - python=3.9

  # ShortStop runtime dependencies
  - pandas
  - matplotlib-base
  - protlearn
  - seaborn
  - scikit-learn
  - joblib
  - plotly
  - eli5
  - umap-learn

  # ShortStop ships a binary XGBoost model that requires XGBoost < 3.1.
  - conda-forge::xgboost<3.1
  - tensorflow-cpu=2.11.*

  # Fixes for GLIBCXX / runtime issues
  - libstdcxx-ng>=12
  - libgcc-ng>=12

  # Toolchain for building ShortStop's C extensions on HPC nodes
  - compilers
  - make
  - sysroot_linux-64
  - setuptools<81
  - wheel

  # Needed so pip + git install works reproducibly
  - pip
  - git
