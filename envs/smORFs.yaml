name: smORFs
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - fastqc
  - fastp
  - stringtie
  - gffread
  - samtools

  # Python libs scripts use
  - pandas
  - biopython
  - matplotlib
  - protlearn
  - seaborn
  - scikit-learn
  - joblib
  - plotly
  - eli5

  # ShortStop ships a binary XGBoost model that requires XGBoost < 3.1.
  - conda-forge::xgboost<3.1
  - tensorflow-cpu=2.11.*

  # Fixes for GLIBCXX / runtime issues
  - libstdcxx-ng>=12
  - libgcc-ng>=12

  # Toolchain for building ShortStop's C extensions on HPC nodes
  - compilers
  - make
  - sysroot_linux-64
  - setuptools<81
  - wheel

  # Needed so pip + git install works reproducibly
  - pip
  - git
  - umap-learn
  - pip:
      - TD2
      # ShortStop currently depends on the obsolete PyPI package `umap==0.1.1`.
      # Install it from a pip requirements file so `--no-deps` is interpreted by pip.
      - "-r envs/shortstop-pip-requirements.txt"
