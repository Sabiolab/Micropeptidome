name: smORFs
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - fastqc
  - fastp
  - stringtie=3.0.3
  - gffread
  - samtools

  # Core Python libs used by the pipeline scripts.
  - pandas
  - biopython
  - matplotlib-base

  # Needed so pip install of TD2 works reproducibly.
  - pip
  - git
  - pip:
      - TD2
